[project]
name = "loop-engineering-api"
version = "0.1.0"
description = "FastAPI backend for the Loop Engineering analysis runtime."
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.0,<2.0.0",
  "fastapi>=0.115.0,<0.138.0",
  "httpx>=0.27.0,<0.28.0",
  "langgraph>=1.0.0,<2.0.0",
  "pydantic-settings>=2.6.0,<3.0.0",
  "pypdf>=4.3,<7.0",
  "pymysql>=1.1.0,<2.0.0",
  "python-dotenv>=1.0.1,<2.0.0",
  "reportlab>=4.0,<5.0",
  "sqlalchemy>=2.0.35,<3.0.0",
  "uvicorn[standard]>=0.32.0,<1.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
